<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quagsire</title>
</head>
<body>
    <header>
        <img src="https://wallpapercave.com/wp/wp2525685.png" alt="Imagem do Quagsire acenando">
        <div>
        <h1>Quagsire!</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="about.html">Veja mais</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
        </div>
    </header>

    <main>
        <h2 class="center">Fazer um comentário</h2>
        <form>
            <div class="pergunta">
                <label for="nome">Seu nome:</label>
                <input id="nome" type="text" placeholder="Digite seu nome">
            </div>

            <div class="pergunta">
                <label for="email">Seu email:</label>
                <input id="email" type="email" placeholder="Digite seu endereço de email">
            </div>

            <div class="pergunta">
                <label for="msg">Seu comentário:</label>
                <textarea id="msg" rows="5" placeholder="Escreva um comentário respeitoso :D"></textarea>
            </div>

            <button type="submit" class="enviar-button">Enviar!</button>
        </form>
    </main>

    <footer>
        <p>Feito por Hadassa Favari</p>
        <p>Repositório no <a href="https://github.com/hadss4/quagsire">Github</a></p>
    </footer>
</body>
</html>
